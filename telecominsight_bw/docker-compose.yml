services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: telecom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: telecominsight
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telecom -d telecominsight"]
      interval: 5s
      timeout: 5s
      retries: 10

  provider-site:
    build: .
    restart: unless-stopped
    command: ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      DATABASE_URL: postgresql://telecom:${POSTGRES_PASSWORD}@db:5432/telecominsight
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-0}
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  admin-site:
    build: .
    restart: unless-stopped
    command: ["streamlit", "run", "admin_app.py", "--server.port", "8502", "--server.address", "0.0.0.0"]
    environment:
      DATABASE_URL: postgresql://telecom:${POSTGRES_PASSWORD}@db:5432/telecominsight
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8502:8502"
    depends_on:
      provider-site:
        condition: service_healthy

volumes:
  pgdata: